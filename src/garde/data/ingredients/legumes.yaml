chickpeas:
  name: Chickpeas
  opened_days: 3  # once opened (drafted)
  classes: [legume, pulse]
  roles: [bulk, protein, sauce_base]
  flavour: [nutty, earthy]
  colour: yellow
  season: [all]
  price: cheap
  unit_weight: 240  # a drained tin
  made_from:
    ingredient: dried_chickpeas
    ratio: 0.375  # measured: 90g dried -> 240g cooked, a tin's worth (2 portions)
    batch: 600  # a pot: ~225g dried
    keeps_days: 4
    time: {active: 10, passive: 90}  # soaked overnight, then simmered
  nutrition: [high_protein, high_fibre]
  notes: Aquafaba (liquid) is separately useful as binder/emulsifier.

