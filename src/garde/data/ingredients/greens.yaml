  colour: green
  season: [all]
  price: moderate
  pack_weight: 100
  stock_ratio: 0.15  # dried leaf per gram as it lands in the dish (drafted)
  max_per_serving: 40  # dish grams, ~6g dried: strong and hay-like (drafted)
  nutrition: [high_iron]
  notes: Crumble into soups, stews and green sauces, or soak 10 minutes first.

