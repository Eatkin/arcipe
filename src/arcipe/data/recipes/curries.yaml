rajma:
  name: Rajma
  description: >
    Simple, light kidney bean curry. Tomato forward, no cream.
    Spiced but not fiery. One of those dishes that's better the next day.
  colour_dominant: red
  cuisine_context: [indian]
  preferred_ingredients: [tomato, cumin, coriander_seed, turmeric_dried, kidney_beans]
  required_ingredients: []
  slots: [curry_grain_base, curry_aromatic, spice_bloom, tomato_sauce_body, curry_protein, finish_herb]
  edges:
    - {from: curry_aromatic,    to: spice_bloom,       type: combine}
    - {from: spice_bloom,       to: tomato_sauce_body, type: combine}
    - {from: curry_protein,     to: tomato_sauce_body, type: fold_in}
    - {from: tomato_sauce_body, to: curry_grain_base,  type: coat}
    - {from: finish_herb,       to: curry_grain_base,  type: finish}

butter_chickpeas:
  name: Butter Chickpeas
  description: >
    Vegan butter chicken adjacent. Rich creamy tomato sauce,
    chickpeas as protein. Fat emulsifier is coconut milk or cashew/sunflower cream.
    Garam masala and cumin forward.
  colour_dominant: orange
  cuisine_context: [indian]
  preferred_ingredients: [garam_masala, turmeric_dried, smoked_paprika, mixed_spice, canned_tomato]
  required_ingredients: []
  slots: [curry_grain_base, curry_aromatic, spice_bloom, tomato_sauce_body, creamy_curry_fat, curry_protein, finish_herb]
  edges:
    - {from: curry_aromatic,    to: spice_bloom,       type: combine}
    - {from: spice_bloom,       to: tomato_sauce_body, type: combine}
    - {from: creamy_curry_fat,  to: tomato_sauce_body, type: emulsify}
    - {from: curry_protein,     to: tomato_sauce_body, type: fold_in}
    - {from: tomato_sauce_body, to: curry_grain_base,  type: coat}
    - {from: finish_herb,       to: curry_grain_base,  type: finish}
  notes: Blitz half the sauce before adding chickpeas for texture.

cauliflower_madras:
  name: Cauliflower Madras
  description: >
    Hot, dry-ish tomato curry. Cauliflower roasted before going in — keeps texture.
    Chilli forward, no fat emulsifier.
  colour_dominant: red
  cuisine_context: [indian]
  preferred_ingredients: [garam_masala, chilli_powder, turmeric_dried, ginger, canned_tomato]
  required_ingredients: [cauliflower]
  slots: [curry_grain_base, curry_aromatic, spice_bloom, tomato_sauce_body, curry_protein, finish_herb]
  edges:
    - {from: curry_aromatic,    to: spice_bloom,       type: combine}
    - {from: spice_bloom,       to: tomato_sauce_body, type: combine}
    - {from: curry_protein,     to: tomato_sauce_body, type: fold_in}
    - {from: tomato_sauce_body, to: curry_grain_base,  type: coat}
    - {from: finish_herb,       to: curry_grain_base,  type: finish}
  notes: Cauliflower preferred for curry_protein — roast at 200°C first.

vindaloo:
  name: Vindaloo
  description: >
    Fierce. Tomato and vinegar base, heavy chilli.
    Vinegar is structural not optional — it's what makes it vindaloo.
    Chickpeas or potato as bulk.
  colour_dominant: red
  cuisine_context: [indian]
  preferred_ingredients: []
  required_ingredients: []
  slots: [curry_grain_base, curry_aromatic, spice_bloom, tomato_sauce_body, acid_component, curry_protein, finish_herb]
  edges:
    - {from: curry_aromatic,    to: spice_bloom,       type: combine}
    - {from: spice_bloom,       to: tomato_sauce_body, type: combine}
    - {from: acid_component,    to: tomato_sauce_body, type: fold_in}
    - {from: curry_protein,     to: tomato_sauce_body, type: fold_in}
    - {from: tomato_sauce_body, to: curry_grain_base,  type: coat}
    - {from: finish_herb,       to: curry_grain_base,  type: finish}
  notes: Without vinegar it's just a hot tomato curry, not a vindaloo.

saag:
  name: Saag (Aloo / Tofu / Chana)
  description: >
    Spinach-based green curry sauce. Starchy bulk slot takes potato (aloo),
    tofu, or chickpeas (chana). Creamy fat optional but recommended.
  colour_dominant: green
  cuisine_context: [indian]
  preferred_ingredients: [cumin, coriander_seed, turmeric_dried, fenugreek_seed]
  required_ingredients: []
  slots: [curry_grain_base, curry_aromatic, whole_spice_bloom, spice_bloom, saag_green, creamy_curry_fat, starchy_bulk, finish_herb]
  edges:
    - {from: whole_spice_bloom, to: curry_aromatic,   type: combine}
    - {from: curry_aromatic,    to: spice_bloom,      type: combine}
    - {from: spice_bloom,       to: saag_green,       type: combine}
    - {from: creamy_curry_fat,  to: saag_green,       type: emulsify}
    - {from: starchy_bulk,      to: saag_green,       type: fold_in}
    - {from: saag_green,        to: curry_grain_base, type: coat}
    - {from: finish_herb,       to: curry_grain_base, type: finish}
  notes: Frozen spinach is canonical. Fresh works but you need a lot of it.

katsu_curry:
  name: Katsu Curry
  description: >
    Japanese-style mild sweet curry sauce. Roux base thickened with flour,
    sweetened with apple and banana, spiced with curry powder.
    Serve over rice with whatever bulk veg you fancy.
  colour_dominant: yellow
  cuisine_context: [japanese]
  preferred_ingredients: [tomato_ketchup, tofu, curry_powder, garam_masala]
  required_ingredients: [roux]
  slots: [curry_grain_base, curry_aromatic, spice_bloom, tomato_enhancement, katsu_sauce_body, katsu_sweetener, curry_protein, finish_herb]
  edges:
    - {from: curry_aromatic,     to: katsu_sauce_body, type: combine}
    - {from: spice_bloom,        to: katsu_sauce_body, type: fold_in}
    - {from: katsu_sweetener,    to: katsu_sauce_body, type: blend}
    - {from: tomato_enhancement, to: katsu_sauce_body, type: combine}
    - {from: curry_protein,      to: katsu_sauce_body, type: top}
    - {from: katsu_sauce_body,   to: curry_grain_base, type: coat}
    - {from: finish_herb,        to: curry_grain_base, type: finish}
  notes: Cauliflower or tofu as curry_protein. Ketchup preferred over puree.

carrot_curry_gravy:
  name: Roasted Carrot Curry Gravy
  description: >
    Cheap, deeply satisfying. Root veg roasted until caramelised then blended
    with tomato and spices into a smooth, mildly sweet gravy.
    Carrot is canonical but parsnip, squash, sweet potato all work.
  colour_dominant: orange
  cuisine_context: [indian]
  preferred_ingredients: []
  required_ingredients: []
  slots: [curry_grain_base, curry_aromatic, spice_bloom, root_sauce_body, tomato_sauce_body, curry_protein, finish_herb]
  edges:
    - {from: curry_aromatic,    to: spice_bloom,       type: combine}
    - {from: root_sauce_body,   to: tomato_sauce_body, type: blend}
    - {from: spice_bloom,       to: tomato_sauce_body, type: fold_in}
    - {from: curry_protein,     to: tomato_sauce_body, type: fold_in}
    - {from: tomato_sauce_body, to: curry_grain_base,  type: coat}
    - {from: finish_herb,       to: curry_grain_base,  type: finish}
  notes: Roast carrot at 200°C until edges are dark. Blend with stock before combining with tomato.
